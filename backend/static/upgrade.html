<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEO Inspector — Upgrade</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #f5f7fa; color: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.container { background: #fff; border-radius: 12px; box-shadow: 0 2px 20px rgba(0,0,0,0.08); width: 420px; padding: 32px; }
.logo { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
.logo svg { color: #2563eb; }
.logo h1 { font-size: 18px; font-weight: 600; }
.tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
.tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-size: 14px; font-weight: 500; color: #999; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: 0.2s; }
.tab.active { color: #2563eb; border-bottom-color: #2563eb; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 4px; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; transition: border-color 0.2s; }
.form-group input:focus { outline: none; border-color: #2563eb; }
.btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
.btn-primary { background: #2563eb; color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-gold { background: linear-gradient(135deg, #c9a84c, #e2c86b); color: #1a1a2e; }
.btn-gold:hover { background: linear-gradient(135deg, #b8993e, #d4b955); }
.error { background: #fef2f2; color: #dc2626; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
.success { background: #f0fdf4; color: #16a34a; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
.error.show, .success.show { display: block; }
.hidden { display: none; }
#authSection { }
#upgradeSection { }
.pricing-card { border: 2px solid #eee; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; }
.pricing-card.featured { border-color: #c9a84c; background: #fffdf5; }
.plan-name { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.plan-price { font-size: 36px; font-weight: 700; color: #2563eb; margin-bottom: 4px; }
.plan-period { font-size: 13px; color: #888; margin-bottom: 16px; }
.plan-features { list-style: none; text-align: left; margin-bottom: 20px; }
.plan-features li { padding: 6px 0; font-size: 13px; color: #555; display: flex; align-items: center; gap: 6px; }
.plan-features li::before { content: '✓'; color: #16a34a; font-weight: 700; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.badge-free { background: #e0e7ff; color: #4338ca; }
.badge-pro { background: #c9a84c; color: #fff; }
.user-info { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
.user-email { font-size: 13px; color: #555; }
.logout-link { font-size: 12px; color: #999; cursor: pointer; }
.logout-link:hover { color: #dc2626; }
.status-section { text-align: center; padding: 24px 0; }
.status-section svg { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <h1>SEO Inspector</h1>
  </div>

  <div id="authSection">
    <div class="tabs">
      <div class="tab active" data-tab="login">Log In</div>
      <div class="tab" data-tab="register">Register</div>
    </div>

    <div class="error" id="authError"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary">Log In</button>
    </form>

    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>
  </div>

  <div id="upgradeSection" class="hidden">
    <div class="user-info">
      <span class="user-email" id="userEmail"></span>
      <span class="badge" id="userBadge">Free</span>
      <span class="logout-link" id="logoutBtn">Log out</span>
    </div>

    <div id="alreadyPro" class="hidden">
      <div class="status-section">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <p style="font-size: 16px; font-weight: 600; margin-bottom: 4px;">You're on Pro!</p>
        <p style="font-size: 13px; color: #888;">All premium features are unlocked.</p>
      </div>
    </div>

    <div id="notPro">
      <div class="pricing-card featured">
        <div class="plan-name">Pro</div>
        <div class="plan-price">$5<span style="font-size:16px;">/mo</span></div>
        <div class="plan-period">billed monthly</div>
        <ul class="plan-features">
          <li>Keyword density analysis</li>
          <li>Backlink checker</li>
          <li>Competitor insights</li>
          <li>PDF & CSV exports</li>
          <li>Priority support</li>
        </ul>
        <button class="btn btn-gold" id="upgradeBtn">Upgrade to Pro</button>
      </div>
    </div>

    <div class="error" id="upgradeError"></div>
    <div class="success" id="upgradeSuccess"></div>
  </div>
</div>

<script>
const API = window.location.origin;

let token = localStorage.getItem('seo_token');
let user = JSON.parse(localStorage.getItem('seo_user') || 'null');

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchAuthTab(t.dataset.tab));
});

document.getElementById('loginForm').addEventListener('submit', handleLogin);
document.getElementById('registerForm').addEventListener('submit', handleRegister);
document.getElementById('logoutBtn').addEventListener('click', logout);
document.getElementById('upgradeBtn').addEventListener('click', startUpgrade);

if (token && user) showUpgradeSection();
else showAuthSection();

function switchAuthTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
  document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
  hideAuthError();
}

async function handleLogin(e) {
  e.preventDefault();
  hideAuthError();
  const email = document.getElementById('loginEmail').value;
  const password = document.getElementById('loginPassword').value;
  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');
    token = data.access_token;
    user = data.user;
    localStorage.setItem('seo_token', token);
    localStorage.setItem('seo_user', JSON.stringify(user));
    showUpgradeSection();
  } catch (err) {
    showAuthError(err.message);
  }
}

async function handleRegister(e) {
  e.preventDefault();
  hideAuthError();
  const email = document.getElementById('regEmail').value;
  const password = document.getElementById('regPassword').value;
  try {
    const res = await fetch(`${API}/api/auth/register`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Registration failed');
    token = data.access_token;
    user = data.user;
    localStorage.setItem('seo_token', token);
    localStorage.setItem('seo_user', JSON.stringify(user));
    showUpgradeSection();
  } catch (err) {
    showAuthError(err.message);
  }
}

function logout() {
  localStorage.removeItem('seo_token');
  localStorage.removeItem('seo_user');
  token = null;
  user = null;
  showAuthSection();
}

async function showUpgradeSection() {
  document.getElementById('authSection').classList.add('hidden');
  document.getElementById('upgradeSection').classList.remove('hidden');
  document.getElementById('userEmail').textContent = user.email;

  try {
    const res = await fetch(`${API}/api/payments/status`, {
      headers: {'Authorization': `Bearer ${token}`}
    });
    const data = await res.json();
    if (data.premium) {
      document.getElementById('alreadyPro').classList.remove('hidden');
      document.getElementById('notPro').classList.add('hidden');
      document.getElementById('userBadge').textContent = 'Pro';
      document.getElementById('userBadge').className = 'badge badge-pro';
    } else {
      document.getElementById('alreadyPro').classList.add('hidden');
      document.getElementById('notPro').classList.remove('hidden');
    }
  } catch {
    // keep default
  }
}

function showAuthSection() {
  document.getElementById('authSection').classList.remove('hidden');
  document.getElementById('upgradeSection').classList.add('hidden');
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('regEmail').value = '';
  document.getElementById('regPassword').value = '';
}

async function startUpgrade() {
  hideUpgradeMessages();
  document.getElementById('upgradeBtn').disabled = true;
  document.getElementById('upgradeBtn').textContent = 'Redirecting...';
  try {
    const res = await fetch(`${API}/api/payments/create-checkout`, {
      method: 'POST', headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
      body: JSON.stringify({
        success_url: `${API}/upgrade?success=1`,
        cancel_url: `${API}/upgrade?cancel=1`
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Checkout failed');
    window.location.href = data.url;
  } catch (err) {
    showUpgradeError(err.message);
    document.getElementById('upgradeBtn').disabled = false;
    document.getElementById('upgradeBtn').textContent = 'Upgrade to Pro';
  }
}

function showAuthError(msg) {
  const el = document.getElementById('authError');
  el.textContent = msg;
  el.classList.add('show');
}

function hideAuthError() {
  document.getElementById('authError').classList.remove('show');
}

function showUpgradeError(msg) {
  const el = document.getElementById('upgradeError');
  el.textContent = msg;
  el.classList.add('show');
}

function showUpgradeSuccess(msg) {
  const el = document.getElementById('upgradeSuccess');
  el.textContent = msg;
  el.classList.add('show');
}

function hideUpgradeMessages() {
  document.getElementById('upgradeError').classList.remove('show');
  document.getElementById('upgradeSuccess').classList.remove('show');
}

const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('success') === '1') {
  if (token && user) {
    showUpgradeSection();
    document.getElementById('alreadyPro').classList.remove('hidden');
    document.getElementById('notPro').classList.add('hidden');
    document.getElementById('userBadge').textContent = 'Pro';
    document.getElementById('userBadge').className = 'badge badge-pro';
    showUpgradeSuccess('Payment successful! Refresh the extension to unlock premium features.');
  }
}
if (urlParams.get('cancel') === '1') {
  if (token && user) {
    showUpgradeSection();
    showUpgradeError('Payment was cancelled. You can try again when ready.');
  }
}
</script>
</body>
</html>
